name: CI/CD — Padel Makassar (PostgreSQL Tests & aaPanel Auto-Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_build:
    name: 1. Test Backend (PostgreSQL) & Build Frontend (Vue 3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: booking_padel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with pgsql
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel Pint code style check
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Generate dynamic test APP_KEY
        working-directory: apps/api
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> $GITHUB_ENV

      - name: Run PHPUnit test suite against real PostgreSQL 16
        working-directory: apps/api
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: booking_padel_test
          DB_USERNAME: postgres
          DB_PASSWORD: ''
        run: php artisan test --ansi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build Vue 3 + TypeScript frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  deploy_aapanel:
    name: 2. Auto-Deploy to aaPanel Server
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check if SSH secrets are configured
        id: check_secrets
        env:
          SSH_HOST: ${{ secrets.AAPANEL_SSH_HOST }}
          SSH_KEY: ${{ secrets.AAPANEL_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AAPANEL_SSH_HOST / AAPANEL_SSH_PRIVATE_KEY secrets belum diisi di GitHub Settings -> Secrets. Auto-deploy dilewati."
          fi

      - name: Execute remote deployment on aaPanel via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AAPANEL_SSH_HOST }}
          username: ${{ secrets.AAPANEL_SSH_USER || 'root' }}
          port: ${{ secrets.AAPANEL_SSH_PORT || 22 }}
          key: ${{ secrets.AAPANEL_SSH_PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/booking-padel
            bash deploy.sh
